name: sistema-personalizado

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gestion_comercial
      MYSQL_USER: ${DB_USER:-sie_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-sie_dev_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_dev_password}
    ports:
      - "${MYSQL_PORT:-3308}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/gestion_comercial?serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-sie_app}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-sie_dev_password}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin_demo}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      APP_VENTAS_USERNAME: ${APP_VENTAS_USERNAME:-ventas_demo}
      APP_VENTAS_PASSWORD: ${APP_VENTAS_PASSWORD:-}
      APP_ALMACEN_USERNAME: ${APP_ALMACEN_USERNAME:-almacen_demo}
      APP_ALMACEN_PASSWORD: ${APP_ALMACEN_PASSWORD:-}
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://127.0.0.1:8080/api/estado > /dev/null || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build:
      context: ./frontend
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-api:8080}
      NGINX_ENVSUBST_FILTER: ^API_UPSTREAM$
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8081}:80"

volumes:
  mysql_data:
